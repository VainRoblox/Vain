on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24.15.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Clone source files
      uses: actions/checkout@v6

    - name: Clone destination files
      uses: actions/checkout@v6
      with:
        repository: VainRoblox/VainCompiled
        token: ${{ secrets.ACTIONS_GITHUB_TOKEN }}
        path: "./VainCompiled"

    - name: Clone bundler
      uses: actions/checkout@v6
      with:
        repository: VainRoblox/VainBundler
        path: "./VainBundler"

    - name: Copy bundler configuration
      run: |-
        mv ./.github/workflows/workflowConfig.json ./VainBundler/config.json

    - name: Install node packages
      run: |-
        cd ./VainBundler
        npm i

    - name: Set up Node.js
      uses: actions/setup-node@v6

    - name: Run Bundler
      run: |-
        node ./VainBundler/index.js prod

    - name: Setup git commit
      run: |-
        git config --global user.name "github-actions[bot]"
        git config --global user.email "username@users.noreply.github.com"

    - name: Push commit
      run: |-
        cd ./VainCompiled
        git add .
        # A commit that only touches files outside src/ produces an identical bundle,
        # and git commit exits non-zero when there is nothing to commit - which failed
        # the whole run and reported a broken build when nothing was wrong.
        if git diff --cached --quiet; then
          echo "No bundle changes to publish."
        else
          git commit -m "Updated Vain"
          git push origin
        fi
